server.port=9080
spring.application.name=wishlist
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.mongodb.host=${DB_HOST:databasedev}
spring.mongodb.port=${DB_PORT:27017}
spring.mongodb.database=${DB_DATABASE:wishlist}
spring.mongodb.username=${DB_USER:admin_user}
spring.mongodb.password=${DB_PASS:Su@S&nh@!@#Fort&!@qu!}
spring.mongodb.authentication-database=admin
spring.data.mongodb.auto-index-creation=true

spring.datasource.url=jdbc:h2:mem:wishlist;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
wishlist.repository.type=${WISHLIST_REPOSITORY_TYPE:mongo}
